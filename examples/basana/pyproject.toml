[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basana-benchmark"
version = "0.1.0"
description = "Benchmark for Basana trading system"
requires-python = ">=3.14,<3.15"
dependencies = [
    "basana",
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
[tool.uv]
package = false
