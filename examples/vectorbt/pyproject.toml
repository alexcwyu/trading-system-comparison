[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbt-benchmark"
version = "0.1.0"
description = "VectorBT benchmark for trading system comparison"
requires-python = ">=3.15,<3.16"
dependencies = [
    "vectorbt>=0.24.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "numba>=0.53.0",
    "scipy>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
[tool.uv]
package = false
