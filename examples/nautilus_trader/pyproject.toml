[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-trader-benchmark"
version = "0.1.0"
description = "NautilusTrader benchmark for trading system comparison"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nautilus_trader",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "psutil",  # For CPU/memory monitoring
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
]
[tool.uv]
package = false
