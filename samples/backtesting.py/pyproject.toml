[project]
name = "backtesting-benchmark"
version = "0.1.0"
description = "Benchmark for Backtesting.py"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Trading System Benchmark Team", email = "example@example.com"}
]

dependencies = [
    "backtesting>=0.6.4",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

