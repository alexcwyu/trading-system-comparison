[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-trader-benchmark"
version = "0.1.0"
description = "NautilusTrader benchmark for trading system comparison"
requires-python = ">=3.9"
dependencies = [
    "nautilus_trader==1.217.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "psutil",  # For CPU/memory monitoring
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=21.5b2",
    "isort>=5.9.1",
] 